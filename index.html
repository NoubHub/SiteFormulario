<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Avançados</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <h2>Formalário Avançado</h2>

    <form>
        <label>Nome Completo:</label>
        <input type="text" id="nome" required minlength="3" maxlength="50">

        <fieldset>
            
            

            <legend>Escolha o turno de atendimento: </legend>
            <input type="radio" id="manha" name="turno" value="manha" required>
            <label>Manhã</label>

            <input type="radio" id="tarde" name="turno" value="tarde" required>
            <label>Tarde</label>



        </fieldset>
        <button type="submit"><img src="marcos.jpg" height="250"></button>
    </form>
</body>
</html>
